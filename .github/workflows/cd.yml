name: Application CD

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ghostfolio-asg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish deployment version to SSM
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${ECR_REPOSITORY:?ECR_REPOSITORY is not configured}"
          : "${AWS_REGION:?AWS_REGION is not configured}"

          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid Git SHA"
            exit 1
          }

          IMAGE="${ECR_REPOSITORY}:${IMAGE_SHA}"

          aws ssm put-parameter \
            --name "/ghostfolio/deploy/image" \
            --type "String" \
            --value "$IMAGE" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Deployment image published: $IMAGE"
          echo "ASG watchers will detect the new version."
