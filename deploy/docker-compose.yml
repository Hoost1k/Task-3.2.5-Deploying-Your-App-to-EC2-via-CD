name: ghostfolio
services:
  ghostfolio:
    image: __ECR_IMAGE__
    container_name: ghostfolio
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
      - .env.elasticache
      - .env.rds 
    pull_policy: always
    ports:
      - "127.0.0.1:3333:3333"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /ghostfolio/application
        awslogs-stream: ghostfolio-ec2
        awslogs-create-group: "false"

volumes:
  postgres:
